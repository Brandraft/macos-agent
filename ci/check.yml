name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck setup.sh lib/network.sh tests/*.sh
      - run: bash tests/check.sh
      - run: python3 tests/test_network.py
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash tests/check.sh
      - run: bash tests/macos-smoke.sh
